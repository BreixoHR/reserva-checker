<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Reserva Checker · Opciones</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Reserva Checker</h1>
    <p class="lead">Conexión con el backend de verificación de reservas.</p>

    <form id="settings">
      <label for="endpoint">Endpoint</label>
      <input id="endpoint" type="url" required placeholder="https://mi-org.my.salesforce-sites.com/services/apexrest/reserva-checker/v3">

      <label for="apiKey">API key</label>
      <input id="apiKey" type="password" required autocomplete="off">
      <p class="hint">Se guarda solo en este navegador (<code>chrome.storage.local</code>) y nunca se expone a las webs visitadas.</p>

      <div class="actions">
        <button type="submit">Guardar</button>
        <button type="button" id="test" class="secondary">Probar conexión</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="../lib/api.js"></script>
  <script src="options.js"></script>
</body>
</html>
